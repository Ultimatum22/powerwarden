name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on:
      - homelab
      - proxmox
    steps:
      - uses: actions/checkout@v4

      # Slim runner images lack make, and go test -race needs cgo (gcc + libc headers).
      - name: Install build tools
        run: |
          if command -v make >/dev/null && command -v gcc >/dev/null; then exit 0; fi
          SUDO=""; [ "$(id -u)" -eq 0 ] || SUDO=sudo
          if command -v apt-get >/dev/null; then
            $SUDO apt-get update -qq
            $SUDO apt-get install -y -qq --no-install-recommends make gcc libc6-dev
          elif command -v apk >/dev/null; then
            $SUDO apk add --no-cache make gcc musl-dev
          else
            echo "::error::no supported package manager to install make/gcc"; exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install lint/vuln tools
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # make release runs the full check suite (gofmt, vet, test -race,
      # staticcheck, govulncheck) before cross-compiling, so a broken
      # tag never gets published.
      - name: make release
        run: make release
        env:
          VERSION: ${{ github.ref_name }}

      - name: Publish release with binary + checksum
        uses: https://code.forgejo.org/actions/forgejo-release@v2
        with:
          direction: upload
          url: ${{ github.server_url }}
          repo: ${{ github.repository }}
          release-dir: bin
          release-notes: "labpower ${{ github.ref_name }}, built for linux/arm64 (Raspberry Pi OS Lite 64-bit)."
          token: ${{ secrets.RELEASE_TOKEN }}
