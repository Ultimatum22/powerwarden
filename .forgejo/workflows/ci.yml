name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  # Pinned so the tools come from the module/build cache instead of being
  # rebuilt from source on every run. Bump them by hand.
  STATICCHECK_VERSION: v0.8.1  # honnef.co/go/tools
  GOVULNCHECK_VERSION: v1.8.0  # golang.org/x/vuln

jobs:
  check:
    runs-on:
      - homelab
      - proxmox
    steps:
      - uses: actions/checkout@v7

      # Slim runner images lack make, and go test -race needs cgo (gcc + libc headers).
      - name: Install build tools
        run: |
          if command -v make >/dev/null && command -v gcc >/dev/null; then exit 0; fi
          SUDO=""; [ "$(id -u)" -eq 0 ] || SUDO=sudo
          if command -v apt-get >/dev/null; then
            $SUDO apt-get update -qq
            $SUDO apt-get install -y -qq --no-install-recommends make gcc libc6-dev
          elif command -v apk >/dev/null; then
            $SUDO apk add --no-cache make gcc musl-dev
          else
            echo "::error::no supported package manager to install make/gcc"; exit 1
          fi

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install lint/vuln tools
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}
          go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Everything CLAUDE.md requires before finishing a task, run the
      # same way locally: gofmt, go vet, go test -race, staticcheck,
      # govulncheck.
      - name: make check
        run: make check
