name: Image

# Builds the labpower container image with ko (no Docker daemon or QEMU
# needed: Go cross-compiles) and pushes it to the homelab registry.
#
# Repository settings (Forgejo → Settings → Actions):
#   variable REGISTRY           registry host[:port] that `docker push` uses
#   secret   REGISTRY_USERNAME
#   secret   REGISTRY_PASSWORD  (a token/robot account with push rights only)
#
# Tags pushed:
#   push to main  → :main, :sha-<commit>
#   tag vX.Y.Z    → :vX.Y.Z, :X.Y, :latest
#   other v* tags (e.g. v1.5.0-rc1) → only that tag; latest stays put

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

env:
  KO_VERSION: 0.19.1
  # sha256 of ko_${KO_VERSION}_Linux_<arch>.tar.gz from the release's checksums.txt
  KO_SHA256_X86_64: 635ac6ea3fd376c935fee597fbb29ab2c2449f49ef1655085fe3aa9c25fed7a5
  KO_SHA256_ARM64: 4099b2d1170d3b8a70e049237462efc2dd14d5fa30e9d2e5e108fb4f778cdd3f

jobs:
  image:
    runs-on:
      - homelab
      - proxmox
    timeout-minutes: 45
    env:
      REGISTRY: 10.22.40.24:5555
      REGISTRY_HOST: 10.22.40.24
      SSH_TARGET: homelabuser@10.22.40.24
      SSH_OPTS: "-F /dev/null -T -p 2809 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes"
      SCP_OPTS: "-F /dev/null -P 2809 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes"
    steps:
      - name: Check registry settings
        env:
          REGISTRY: ${{ vars.REGISTRY }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          missing=""
          [ -n "$REGISTRY" ] || missing="$missing variable:REGISTRY"
          [ -n "$REGISTRY_USERNAME" ] || missing="$missing secret:REGISTRY_USERNAME"
          [ -n "$REGISTRY_PASSWORD" ] || missing="$missing secret:REGISTRY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Set these in the repository's Actions settings:$missing"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install lint/vuln tools
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Nothing is pushed unless everything CLAUDE.md requires passes.
      - name: make check
        run: make check

      - name: Install ko ${{ env.KO_VERSION }} (checksum-verified)
        run: |
          case "$(uname -m)" in
            x86_64)        arch=x86_64; sum="$KO_SHA256_X86_64" ;;
            aarch64|arm64) arch=arm64;  sum="$KO_SHA256_ARM64" ;;
            *) echo "::error::unsupported runner architecture $(uname -m)"; exit 1 ;;
          esac
          tarball="ko_${KO_VERSION}_Linux_${arch}.tar.gz"
          curl -fsSL -o "$tarball" "https://github.com/ko-build/ko/releases/download/v${KO_VERSION}/${tarball}"
          echo "${sum}  ${tarball}" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$tarball" -C "$HOME/.local/bin" ko
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Compute version and tags
        id: meta
        run: |
          ref="${GITHUB_REF_NAME}"
          short="$(git rev-parse --short=7 HEAD)"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="$ref"
            tags="$ref"
            if echo "$ref" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              minor="$(echo "${ref#v}" | cut -d. -f1-2)"
              tags="$tags,$minor,latest"
            fi
          else
            version="${ref}-${short}"
            tags="main,sha-${short}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "Version $version, tags $tags"

      - name: Log in to the registry
        env:
          REGISTRY: ${{ vars.REGISTRY }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: echo "$REGISTRY_PASSWORD" | ko login "$REGISTRY" -u "$REGISTRY_USERNAME" --password-stdin

      - name: Build and push (linux/arm64, linux/amd64)
        env:
          KO_DOCKER_REPO: ${{ vars.REGISTRY }}/labpower
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          # --sbom=none: ko would push an extra sha256-….sbom tag per image,
          # cluttering the registry's tag list on every main push.
          ko build ./cmd/labpower --bare --sbom=none --tags "${{ steps.meta.outputs.tags }}" --image-refs image-ref.txt
          # The first line is the multi-arch index; the rest are per platform.
          echo "Pushed ${{ steps.meta.outputs.tags }} as:"
          head -n1 image-ref.txt
          echo "Pin that digest in Ansible (labpower_image) for reproducible deploys."
