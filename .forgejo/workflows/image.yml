name: Image

# Builds the labpower container image with ko (no Docker daemon or QEMU
# needed: Go cross-compiles) and pushes it to the homelab registry.
#
# Same pattern as homelab-new's build-images.yml: the runner builds an OCI
# layout, copies it to vm-registry over SSH, and pushes it from there to the
# registry on localhost (the registry itself has no auth). Docker can't push
# a multi-arch OCI layout, so a checksum-verified crane binary is copied
# along and does the push.
#
# Secrets required:
#   ANSIBLE_SSH_PRIVATE_KEY — SSH key for homelabuser@vm-registry
#
# Tags pushed:
#   push to main  → :main, :sha-<commit>
#   tag vX.Y.Z    → :vX.Y.Z, :X.Y, :latest
#   other v* tags (e.g. v1.5.0-rc1) → only that tag; latest stays put

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

env:
  KO_VERSION: 0.19.1
  # sha256 of ko_${KO_VERSION}_Linux_<arch>.tar.gz from the release's checksums.txt
  KO_SHA256_X86_64: 635ac6ea3fd376c935fee597fbb29ab2c2449f49ef1655085fe3aa9c25fed7a5
  KO_SHA256_ARM64: 4099b2d1170d3b8a70e049237462efc2dd14d5fa30e9d2e5e108fb4f778cdd3f
  CRANE_VERSION: 0.22.1
  # sha256 of go-containerregistry_Linux_<arch>.tar.gz from the release's checksums.txt
  CRANE_SHA256_X86_64: 0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0
  CRANE_SHA256_ARM64: 898c0cff975f898a33e8c4580bdafb0e7c02c7faa33374e946762f97c4ab7110

jobs:
  image:
    runs-on:
      - homelab
      - proxmox
    timeout-minutes: 45
    env:
      REGISTRY: 10.22.40.24:5555
      SSH_TARGET: homelabuser@10.22.40.24
      SSH_OPTS: "-F /dev/null -T -p 2809 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes"
      SCP_OPTS: "-F /dev/null -P 2809 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes"
    steps:
      - uses: actions/checkout@v7

      # Slim runner images lack make, and go test -race needs cgo (gcc + libc headers).
      - name: Install build tools
        run: |
          if command -v make >/dev/null && command -v gcc >/dev/null; then exit 0; fi
          SUDO=""; [ "$(id -u)" -eq 0 ] || SUDO=sudo
          if command -v apt-get >/dev/null; then
            $SUDO apt-get update -qq
            $SUDO apt-get install -y -qq --no-install-recommends make gcc libc6-dev
          elif command -v apk >/dev/null; then
            $SUDO apk add --no-cache make gcc musl-dev
          else
            echo "::error::no supported package manager to install make/gcc"; exit 1
          fi

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install lint/vuln tools
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Nothing is pushed unless everything CLAUDE.md requires passes.
      - name: make check
        run: make check

      - name: Install ko ${{ env.KO_VERSION }} (checksum-verified)
        run: |
          case "$(uname -m)" in
            x86_64)        arch=x86_64; sum="$KO_SHA256_X86_64" ;;
            aarch64|arm64) arch=arm64;  sum="$KO_SHA256_ARM64" ;;
            *) echo "::error::unsupported runner architecture $(uname -m)"; exit 1 ;;
          esac
          tarball="ko_${KO_VERSION}_Linux_${arch}.tar.gz"
          curl -fsSL -o "$tarball" "https://github.com/ko-build/ko/releases/download/v${KO_VERSION}/${tarball}"
          echo "${sum}  ${tarball}" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$tarball" -C "$HOME/.local/bin" ko
          rm -f "$tarball"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install SSH private key
        env:
          SSH_KEY: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "::error::secret ANSIBLE_SSH_PRIVATE_KEY is not set for this repository"; exit 1
          fi
          # Undo common copy/paste damage: CRLF line endings, literal "\n"
          # sequences, and a missing final newline.
          key="$(printf '%s' "$SSH_KEY" | tr -d '\r' | sed 's/\\n/\n/g')"
          case "$key" in
            "-----BEGIN "*) ;;
            *) echo "::error::ANSIBLE_SSH_PRIVATE_KEY does not start with a -----BEGIN ...----- line"; exit 1 ;;
          esac
          # Diagnostics without revealing the key.
          echo "key: $(printf '%s\n' "$key" | head -n1), $(printf '%s\n' "$key" | wc -l) lines"
          eval "$(ssh-agent -s)"
          printf '%s\n' "$key" | ssh-add -
          echo "SSH_AUTH_SOCK=${SSH_AUTH_SOCK}" >> "${GITHUB_ENV}"
          echo "SSH_AGENT_PID=${SSH_AGENT_PID}" >> "${GITHUB_ENV}"

      - name: Compute version and tags
        id: meta
        run: |
          ref="${GITHUB_REF_NAME}"
          short="$(git rev-parse --short=7 HEAD)"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="$ref"
            tags="$ref"
            if echo "$ref" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              minor="$(echo "${ref#v}" | cut -d. -f1-2)"
              tags="$tags $minor latest"
            fi
          else
            version="${ref}-${short}"
            tags="main sha-${short}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "Version $version, tags $tags"

      - name: Build OCI layout (linux/arm64, linux/amd64)
        env:
          # Only names the image inside the layout; nothing is pushed here.
          KO_DOCKER_REPO: localhost/labpower
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          # --sbom=none: no extra sha256-….sbom artifacts next to the image.
          ko build ./cmd/labpower --bare --sbom=none --push=false --oci-layout-path oci-layout

      - name: Fetch crane ${{ env.CRANE_VERSION }} for vm-registry (checksum-verified)
        run: |
          # crane runs on vm-registry, so match its architecture, not the runner's.
          remote_arch="$(ssh ${SSH_OPTS} ${SSH_TARGET} uname -m)"
          case "$remote_arch" in
            x86_64)        arch=x86_64; sum="$CRANE_SHA256_X86_64" ;;
            aarch64|arm64) arch=arm64;  sum="$CRANE_SHA256_ARM64" ;;
            *) echo "::error::unsupported vm-registry architecture $remote_arch"; exit 1 ;;
          esac
          tarball="go-containerregistry_Linux_${arch}.tar.gz"
          curl -fsSL -o "$tarball" "https://github.com/google/go-containerregistry/releases/download/v${CRANE_VERSION}/${tarball}"
          echo "${sum}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" crane
          rm -f "$tarball"

      - name: Push from vm-registry
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          SSH="ssh ${SSH_OPTS} ${SSH_TARGET}"
          REMOTE_DIR="/tmp/labpower-image-${GITHUB_RUN_ID}"

          push() {
            $SSH "mkdir -p ${REMOTE_DIR}" || return 1
            scp ${SCP_OPTS} -rp oci-layout crane "${SSH_TARGET}:${REMOTE_DIR}/" || return 1
            # The layout holds one multi-arch index: push it once, then tag it.
            first="${TAGS%% *}"
            $SSH "cd ${REMOTE_DIR} && ./crane push --insecure oci-layout localhost:5555/labpower:${first}" > pushed.txt || return 1
            for tag in ${TAGS#"$first"}; do
              $SSH "${REMOTE_DIR}/crane tag --insecure localhost:5555/labpower:${first} ${tag}" || return 1
            done
          }

          if push; then
            $SSH "rm -rf ${REMOTE_DIR}"
          else
            $SSH "rm -rf ${REMOTE_DIR}" 2>/dev/null || true
            echo "::error::push to ${REGISTRY}/labpower failed"
            exit 1
          fi

          digest="$(sed -n 's/.*@//p' pushed.txt | tail -n1)"
          echo "Pushed ${REGISTRY}/labpower tags: ${TAGS}"
          echo "${REGISTRY}/labpower@${digest}"
          echo "Pin that digest in Ansible (labpower_image) for reproducible deploys."

      - name: Cleanup
        if: always()
        run: |
          [ -n "${SSH_AGENT_PID}" ] && ssh-agent -k || true
