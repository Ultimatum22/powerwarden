name: Tag release

# Manually triggered (Actions → Tag release → Run workflow): picks the next
# version from the latest vX.Y.Z tag and the chosen bump, then pushes an
# annotated tag on the head of main. That tag push starts image.yml and
# release.yml.
#
# The tag is pushed with RELEASE_TOKEN, not the automatic token: pushes
# made with the automatic token do not trigger other workflows.
#
# Secrets required:
#   RELEASE_TOKEN — Forgejo access token with write:repository scope

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version part to bump'
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

jobs:
  tag:
    runs-on:
      - homelab
      - proxmox
    steps:
      - name: Require main
        run: |
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "::error::run this workflow on main (got ${GITHUB_REF_NAME})"; exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Compute next version
        id: next
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          latest="$(git tag --list 'v*' --sort=-v:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)"
          latest="${latest:-v0.0.0}"
          IFS=. read -r major minor patch <<EOF
          ${latest#v}
          EOF
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
            *) echo "::error::unknown bump '$BUMP'"; exit 1 ;;
          esac
          next="v${major}.${minor}.${patch}"
          if git rev-parse -q --verify "refs/tags/${next}" >/dev/null; then
            echo "::error::tag ${next} already exists"; exit 1
          fi
          echo "Latest ${latest}, ${BUMP} bump → ${next} on $(git rev-parse --short HEAD)"
          echo "version=${next}" >> "$GITHUB_OUTPUT"

      - name: Push tag
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.localhost"
          git tag -a "${VERSION}" -m "labpower ${VERSION}"
          git push origin "refs/tags/${VERSION}"
