{{define "content"}}
<header class="page-head"><h1>Events</h1></header>
<form class="filter" method="get" action="/events">
  <label for="kind">Show</label>
  <select id="kind" name="kind">
    <option value="">All events</option>
    {{range .Data.Kinds}}<option value="{{.}}" {{if eq . $.Data.Kind}}selected{{end}}>{{.}}</option>{{end}}
  </select>
  <button type="submit" class="btn btn-sm">Filter</button>
</form>
<section class="card">
  <ul class="event-list">
    {{range .Data.Events}}{{template "event-item" .}}{{else}}<li class="muted">No events.</li>{{end}}
  </ul>
</section>
<nav class="actions" aria-label="Pages">
  {{if .Data.Newer}}<a class="btn btn-sm" href="/events{{if .Data.Kind}}?kind={{.Data.Kind}}{{end}}">Newest</a>{{end}}
  {{if .Data.OlderURL}}<a class="btn btn-sm" href="{{.Data.OlderURL}}">Older</a>{{end}}
</nav>
{{end}}
