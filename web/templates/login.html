{{define "login"}}
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · labpower</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js"></script>
</head>
<body>
  <div class="login-shell">
    <div class="wordmark">labpower</div>
    <div id="login-error" class="error-text" role="alert"></div>
    <button id="passkey-btn" class="btn btn-primary" type="button">Sign in with passkey</button>
    <a href="#" id="totp-link" class="muted">Use authenticator code</a>

    <form id="totp-form" style="display:none; width:100%; max-width:320px;">
      <label for="code">Authenticator code</label>
      <input type="text" id="code" name="code" inputmode="numeric" autocomplete="one-time-code" required>
      <button type="submit" class="btn btn-primary" style="margin-top:12px; width:100%;">Verify</button>
    </form>
  </div>
  <script src="/static/login.js"></script>
</body>
</html>
{{end}}
