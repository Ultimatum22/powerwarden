# For trying labpower by hand; the homelab uses the Ansible role instead.
# See deploy/README.md. One-time setup:
#   cp deploy/config.example.yaml config.yaml   # fill in every TODO(owner)
#   mkdir secrets && echo -n '<token>' > secrets/proxmox-token && echo -n '<token>' > secrets/notify-token
#   sudo chown -R 65532:65532 config.yaml secrets && sudo chmod 0400 config.yaml secrets/*
#
# Build locally: docker compose up -d --build
# Published:     LABPOWER_IMAGE=<registry>/labpower:v1.2.3 docker compose up -d

services:
  labpower:
    build: { context: ., args: { VERSION: "${VERSION:-dev}" } }
    image: ${LABPOWER_IMAGE:-labpower:dev}
    container_name: labpower
    restart: unless-stopped
    # Host networking so `listen: 127.0.0.1:8080` is the Pi's loopback,
    # reachable only via Newt. Don't swap for a bridge + `ports:`.
    network_mode: host

    # AS3935 sensor only; drop these if weather.local_sensor is disabled.
    # GIDs from `getent group i2c gpio` on the Pi.
    devices: [/dev/i2c-1, /dev/gpiochip0]
    group_add: ["998", "997"]

    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 150m
    pids_limit: 64

    environment:
      CREDENTIALS_DIRECTORY: /run/secrets
    volumes:
      - ./config.yaml:/etc/labpower/config.yaml:ro
      - ./secrets:/run/secrets:ro
      - labpower-state:/var/lib/labpower
      # Lets clock trust see timesyncd's NTP sync marker.
      - /run/systemd/timesync:/run/systemd/timesync:ro

volumes:
  labpower-state:
